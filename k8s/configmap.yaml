apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-api-config
  labels:
    app: catalog-api
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_HTTP_PORTS: "8080"
  Jwt__Issuer: "GameStoreAPI"
  Jwt__Audience: "GameStoreClient"
  Jwt__ExpirationHours: "8"
  RabbitMq__Host: "rabbitmq"
  RabbitMq__Port: "5672"
  RabbitMq__VirtualHost: "/"
  RabbitMq__Queues__OrderPlace: "OrderPlaceEvent"
  RabbitMq__Queues__PaymentProcessedCatalog: "PaymentProcessedEvent.Catalog"
  Services__UserApiUrl: "http://user-api:80"
  Services__CatalogApiUrl: "http://catalog-api:80"
  Services__PaymentsApiUrl: "http://payments-api:80"
  Services__NotificationsApiUrl: "http://notifications-api:80"

